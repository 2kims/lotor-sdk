name: Pull Request

on:
  pull_request:
    types: [labeled, converted_to_draft]

permissions:
  contents: read

jobs:
  title_github:
    name: Validate PR title (GitHub runner attempt)
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:run' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    outputs:
      failed: ${{ steps.runner-result.outputs.failed }}
    steps:
      - name: Check Conventional Commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const pattern = /^(feat|fix|perf|revert|docs|style|refactor|test|chore|release)(\([a-z0-9][a-z0-9._/-]*\))?!?: \S.*$/;
          if (!pattern.test(title)) process.exit(1);
          NODE
      - name: Record runner result
        id: runner-result
        if: always()
        run: echo "failed=${{ job.status == 'failure' }}" >> "$GITHUB_OUTPUT"

  title:
    name: Validate PR title
    needs: title_github
    if: ${{ always() && github.event.action == 'labeled' && github.event.label.name == 'ci:run' && github.event.pull_request.draft == false && needs.title_github.outputs.failed != 'false' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const pattern = /^(feat|fix|perf|revert|docs|style|refactor|test|chore|release)(\([a-z0-9][a-z0-9._/-]*\))?!?: \S.*$/;
          if (!pattern.test(title)) process.exit(1);
          NODE

  test_github:
    name: Test (GitHub runner attempt)
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:run' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    outputs:
      failed: ${{ steps.runner-result.outputs.failed }}
    env:
      LOTOR_PUBLIC_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@9.15.0
      - name: Verify SDK and public package
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm api:check
          pnpm package:check
          git diff --exit-code
      - name: Record runner result
        id: runner-result
        if: always()
        run: echo "failed=${{ job.status == 'failure' }}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: test_github
    if: ${{ always() && github.event.action == 'labeled' && github.event.label.name == 'ci:run' && github.event.pull_request.draft == false && needs.test_github.outputs.failed != 'false' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      LOTOR_PUBLIC_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@9.15.0
      - name: Verify SDK and public package
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm api:check
          pnpm package:check
          git diff --exit-code
